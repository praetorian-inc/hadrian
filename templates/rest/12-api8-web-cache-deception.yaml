# Template: Web Cache Deception - Cacheable Authenticated Response Served by CDN
# Detects a CDN/edge cache that stores an AUTHENTICATED response and then serves
# it to UNAUTHENTICATED clients (Web Cache Deception / CWE-525).
#
# This is the broken-auth template (04-api2-broken-auth-no-token) PLUS a CDN
# cache-HIT header gate. That gate is the entire false-positive control and the
# distinction from plain broken authentication: we fire ONLY when the
# unauthenticated response was demonstrably CACHE-SERVED, not merely reachable.
#
# --- Detection semantics (correctness-critical) -----------------------------
# The REST matcher engine OR-combines matchers: evaluateMatchers() returns true
# on the FIRST matching matcher (pkg/templates/execute.go:664). It has no
# request-level `condition`, `dsl` is unimplemented (execute.go default:continue,
# ~line 660), and the `detection` block below is NOT evaluated for REST — only
# gRPC calls evaluateDetection (pkg/templates/execute_grpc.go:180). REST match is
# driven solely by evaluateMatchers.
#
# Therefore we must NOT add a separate `status` matcher: OR-combination would
# make a plain uncached 200 fire (that is API2 broken auth, out of scope here).
# The status code is also absent from every matcher content string
# (getContent/buildHeaderString, execute.go:730-748), so status cannot be AND-ed
# with a header check inside one matcher either.
#
# The only conjunction the engine supports is WITHIN a single regex matcher via
# `condition` (execute.go:713-716). We use one regex matcher over the response
# headers (`condition: or`) across CDN cache-HIT signals. NOTE: a cache-HIT header
# does NOT imply HTTP 200 — CDNs also cache and serve HIT/Age on 3xx redirects and
# 4xx/5xx errors (Cloudflare: 301/302 ~20m, 404/410 ~3m, 5xx ~1m; RFC 9111 Age
# applies to any cached response). The status code is unavailable to any REST
# matcher (getContent/buildHeaderString expose body/headers only), so this matcher
# fires on ANY cached response at an auth-required endpoint, sensitive 200 or not.
# `requires_llm_triage: true` is therefore the PRIMARY validity/sensitivity gate,
# not merely "final confirmation": triage must confirm the cached body is a
# sensitive/authenticated 2xx payload and reject cached errors/redirects.
# The `age` arm ('^age:\s*[1-9][0-9]*') is the broadest/weakest signal — it fires
# on any cached response regardless of status or vendor, so triage must backstop it.

id: 12-api8-web-cache-deception

info:
  name: "Web Cache Deception - Cacheable Authenticated Response Served by CDN"
  category: "API8:2023"
  severity: "HIGH"
  author: "hadrian"
  description: |
    Detects Web Cache Deception (CWE-525): a CDN or edge cache that stores an
    authenticated API response and subsequently serves it to unauthenticated
    clients. An unauthenticated GET to an auth-required endpoint returns a
    response carrying a CDN cache-HIT signal (e.g. CF-Cache-Status: HIT,
    X-Cache: HIT, a positive Age, or Incapsula's X-Iinfo), indicating it was
    served from the shared cache rather than freshly authorized at the origin.
    IMPORTANT: the cache-HIT header does NOT imply an HTTP 200 — CDNs also cache
    and serve HIT/Age on 3xx redirects and 4xx/5xx errors — and the REST matcher
    cannot read status, so it fires on any cached response at the endpoint. The
    determination that the cached body is a sensitive, authenticated 200 (and not
    a cached error or redirect) is delegated to LLM triage (requires_llm_triage),
    the primary validity gate. Unlike plain broken authentication (API2), a
    confirmed cache-HIT on a sensitive body shows the exposure is caused by a
    cache misconfiguration, so any user hitting the same cache key can retrieve
    another user's authenticated data.
  tags: ["web-cache-deception", "cache-deception", "cwe-525", "security-misconfiguration", "owasp", "owasp-api-top10", "api8"]
  requires_llm_triage: true
  test_pattern: "simple"

# Select auth-required, object-returning GET endpoints. GET is the method CDNs
# key and cache; returns_object biases toward data-bearing responses.
endpoint_selector:
  requires_auth: true
  methods: ["GET"]
  returns_object: true

# No attacker role (unauthenticated request); victim is any authenticated user.
role_selector:
  attacker_permission_level: "none"
  victim_permission_level: "all"

# Single UNAUTHENTICATED GET. Fire only when the response carries a CDN cache-HIT
# header. A single regex matcher (part: header, condition: or) is used because
# the engine OR-combines matchers; a separate status matcher would false-fire on
# a plain uncached 200. See the header comment for the full code citation.
http:
  - method: "GET"
    path: "{{operation.path}}"
    headers:
      Content-Type: "application/json"
    # No Authorization header provided
    matchers:
      - type: regex
        part: header
        condition: or
        regex:
          - '(?im)^cf-cache-status:\s*hit'      # Cloudflare cache hit
          - '(?im)^x-cache:.*hit\b'             # CloudFront / Varnish / Fastly / Akamai TCP_HIT
          - '(?im)^age:\s*[1-9][0-9]*'          # positive Age => served from cache
          - '(?im)^x-iinfo:'                    # Imperva Incapsula edge cache

# Detection logic (advisory for REST — the matcher above drives the match; this
# block documents intent and is consumed by triage/reporting).
detection:
  success_indicators:
    - type: status_code
      status_code: 200
    - type: regex_match
      pattern: '(?im)^(cf-cache-status:\s*hit|x-cache:.*\bhit\b|age:\s*[1-9][0-9]*|x-iinfo:)'
  failure_indicators:
    - type: status_code
      status_code: 401
    - type: status_code
      status_code: 403
  vulnerability_pattern: "cacheable_authenticated_response_served_unauthenticated"
