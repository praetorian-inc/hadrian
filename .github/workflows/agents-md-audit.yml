name: Instruction-File Audit
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
concurrency:
  group: agents-md-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  audit:
    uses: praetorian-inc/public-workflows/.github/workflows/agents-md-audit.yml@6d7f04eca0fc8c6f61121a530fbc2485877da3a6  # v2.21.16
    permissions:
      contents: read
      pull-requests: write
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PALATINE_SKILLS_APP_ID: ${{ secrets.PALATINE_SKILLS_APP_ID }}
      PALATINE_SKILLS_PRIVATE_KEY: ${{ secrets.PALATINE_SKILLS_PRIVATE_KEY }}
