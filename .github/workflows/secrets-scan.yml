name: Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'  # weekly baseline
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    uses: praetorian-inc/public-workflows/.github/workflows/titus-scan.yml@6d7f04eca0fc8c6f61121a530fbc2485877da3a6  # v2.21.16
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
    with:
      fail-on-findings: true

